<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS com classe e id</title>

    <!-- CSS interno dentro do HEAD!!! -->
    <style>
        *{
            background-color: aquamarine;
            margin: 0;
            padding: 0;
        }
        #paragrafo{
            font-size: 25px;
            background-color: red;
            color: white;
            text-align: center;
        }

        /* '#' é para id */
        #informacoes{
            background-color: blue;
            font-size: 30px;
            text-align: center;
        }

        /* '.' é para classe */
        .titulo{
            background-color: blue;
            text-align: center;
            font-weight: bold;
        }

        div a{
            color: red;
        }
    </style>
</head>
<body>
    <p id="paragrafo">CSS aplicado no id</p>
    <p id="informacoes">Informações Complementares</p>

    <h3 class="titulo">CSS aplicado na classe</h3>
    <p class="titulo">Informações com classe</p>

    <table border="1" style="width: 20%;">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="titulo">Ketlin</td>
                <td>16</td>
            </tr>
        </tbody>
    </table>

    <div>
        <a href="">Primeiro link</a>
        <p>Qualquer coisa</p>
    </div>    
</body>
</html>
